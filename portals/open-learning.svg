<svg xmlns="http://www.w3.org/2000/svg" width="360" height="100" viewBox="0 0 360 100" role="img" aria-labelledby="title desc">
  <title id="title">Open Learning Academy Logo</title>
  <desc id="desc">Stylized laptop/book icon with Arabic and English name for Open Learning Academy</desc>
  <rect width="360" height="100" rx="12" fill="transparent"/>
  <g transform="translate(12 10)">
    <!-- laptop / book stylized mark -->
    <rect x="0" y="6" width="64" height="44" rx="6" fill="#2aa6d6" />
    <rect x="6" y="12" width="52" height="28" rx="4" fill="#ffffff" opacity="0.95" />
    <path d="M0 52h64v6H0z" fill="#1b8aa8" />
    <path d="M22 10l10-8 10 8" fill="#ffd26a" opacity="0.95" />
    <circle cx="52" cy="10" r="3" fill="#ffd26a" />
  </g>
  <g transform="translate(92 24)">
    <text x="0" y="0" font-family="'Cairo', 'Tajawal', Arial, sans-serif" font-size="22" fill="#1b8aa8">أكاديمية التعليم المفتوح</text>
    <text x="0" y="30" font-family="'Inter', Arial, sans-serif" font-size="14" fill="#6b7280">Open Learning Academy</text>
  </g>
</svg>
