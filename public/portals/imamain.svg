<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title desc">
  <title id="title">شعار أكاديمية الإمامين</title>
  <desc id="desc">شعار دائري لأكاديمية الإمامين مبسط ملون بالأخضر والبني مع نص عربي</desc>
  <defs>
    <radialGradient id="g" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="transparent"/>
  <g transform="translate(180 180)">
    <circle r="158" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <circle r="128" fill="#ffffff" stroke="#7a4b2b" stroke-width="6"/>
    <g transform="translate(0 -8)">
      <g transform="scale(1) translate(-0,-6)">
        <path d="M0,-24 l36,-36 36,36 36,-36 36,36 -36,36 36,36 -36,36 -36,-36 -36,36 -36,-36 36,-36 z" fill="#7a4b2b" opacity="0.95" />
